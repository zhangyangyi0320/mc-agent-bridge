# mc-agent-bridge configuration
enabled: true

# Bind address. Ignored when exposure flags below enable LAN/public binding.
host: 127.0.0.1
port: 25566

# Bearer token required for every request (except /api/health).
# Leave empty to have a random token generated on first start (then copied here).
token: ""

# When true, only read endpoints work (status/players/worlds/logs/health).
read-only: false

# How many recent console lines to keep for GET /api/logs
log-lines: 2000

# ---- Network exposure ----
# By default the API only listens on 127.0.0.1 (localhost).
# allow_lan     -> bind 0.0.0.0 (reachable from your LAN; a warning is logged)
# allow_public  -> bind 0.0.0.0 AND logs a STRONG warning: anyone who can reach
#                  the port + knows the token can fully control the server.
# Always put a firewall / reverse proxy + TLS in front before enabling public.
exposure:
  allow_lan: false
  allow_public: false

# ---- Feature toggles ----
# Each capability can be enabled/disabled independently. Disabled features
# return HTTP 403. /api/status reports which are enabled.
features:
  status: true
  worlds: true
  players: true
  inventory: true
  plugins: true
  plugin_action: true
  logs: true
  backups: true
  fs: true
  command: true
  commands: true
  broadcast: true
  whitelist: true
  maintenance: true
  server_stop: true
  backup_create: true
  player_action: true
